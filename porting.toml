[[area]]
id = "audio"
status = "implemented"
components = []
paths = ["package/*Adsp*", "package/*Audio*", "package/*Gpr*", "package/*Cs35l43*", "package/GeniI2c*", "package/FatVolume*", "package/QcomGlink*", "package/QcomMdt*", "package/QcomQrtr*", "package/ShengQrtr*", "package/QcomSmem*", "package/QcomSmp2p*", "package/tests/audioreach*", "package/tests/cs35l43*", "package/tests/geni_i2c*", "hal/**", "patches/xnu/zzyd-*", "scripts/*adsp*", "scripts/*audio*", "scripts/*gpr*", "scripts/*cs35l43*", "scripts/*geni*", "scripts/*modem-fw*", "scripts/*qrtr*"]
inputs = ["ADSP firmware from modem_a, SMEM, SMP2P, GLINK, the GPR channel adsp_apps.", "Speakers: six CS35L43 amplifiers on QUP1 SE5 and QUP2 SE0 (I2C 0x40 to 0x42), shared reset gpio90, secondary MI2S (gpio121 to 124).", "Microphones: WCD938x codec on the TX SoundWire master (0x6d30000), reset gpio108, supply ldob15; TX and VA macros."]
configuration = ["sheng-audio takes bits: 1 serves the audio service, 2 plays a 1.5 s test tone at boot, 4 runs the microphone path and reads two seconds of capture. sheng-adsp=2 is required.", "sheng-audio-pa moves the DSP period buffer (default 0xd0000000); sheng-audio-tone-ms and sheng-audio-atten set the tone.", "The payload addon carries hal/ShengAudio.driver under audio/; patches/xnu/zzyd-sheng-audio-addon-mount.patch mounts it over /System/Library/Audio/Plug-Ins/HAL. Its CDHash joins the owner trust cache."]
procedure = ["Read the [audio], [amps], [audio-glink], [audio-buffer], [mic], [mic regs] and [mic capture] log lines with scripts/read-sheng-log.py.", "Run scripts/check-audioreach-host.py, scripts/check-cs35l43-host.py and scripts/check-geni-i2c-host.py after changing the codecs."]
findings = ["The ADSP image loads in place from the split adsp and adsp_dtb files in /image of the modem_a FAT volume.", "The DSP offers 24 intents of 128 bytes on adsp_apps and grants a 4 KiB one on request; the GLINK remote intent table keeps it.", "The amplifiers play ASP RX1 directly (DSP bypassed, no amplifier firmware): top three slot 0, bottom three slot 1, gain 18 dB, 16-bit I2S at 48 kHz from the SoC as clock master.", "The DSP takes buffers as a 32-bit address with the stream index (0x1001 & 0xf) in the upper word. The period buffer is low DRAM outside the kernel's window, mapped write-combined; the audio streams stay in SMMU pass-through.", "Programming a translating SMMU context for the audio streams resets the board; the hypervisor keeps those context banks.", "PRM commands go from the PRM port (2) and use PRM clock ids: the TX core clock is 0x30c. The macro and digital codec votes make the LPASS registers accessible.", "The VA macro gates the TX SoundWire master's clock on SM8550; with its gate and the TX macro's on, the link comes up and the codec enumerates as device 1.", "The primary microphone is AMIC3 on micbias 3 into ADC2, codec data port 1 channel 2, master port 2, TX decimator 0 from SWR_MIC1 and codec DMA TX3, mono 48 kHz."]
completion = ["Each declared route carries the selected audio format through playback or capture and handles start/stop correctly."]
limits = ["The audio server plug-in path (service, ring, union mount) is in place; iOS playback through it has no device result yet.", "Capture runs in the kernel only; the plug-in has no input stream yet."]
next_action = ["Add the plug-in input stream; then qualify iOS playback and capture through the plug-in."]

