schema_version = 1

[device]
name = "sheng"
soc = "SM8550"
os_profile = "ipados-27.0.1-24A446"
summary = "Xiaomi Pad 6S Pro 12.4 uses shared SM8550 support and board-owned storage, input, firmware and power integration. This record describes implementation coverage and the evidence required for each milestone."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore"]
inputs = ["SM8550, the default iPadOS 27.0.1 profile (24A446), the macOS 27.3 override (26C5035r), and pinned arm64e component sources."]
configuration = ["board.soc_source = sm8550; board.os_profile = ipados-27.0.1-24A446; schema_version = 2.", "The device owns ShengUfs, ShengHidInput, ShengNovatekTouch and ShengPreflight submodules."]
procedure = ["Read https://unixnu.com/porting/device-repository and https://unixnu.com/porting/records.", "Run ./unixnu defconfig sheng_ipados27_defconfig -D ../UniXNU-sheng from UniXNU.", "Run ./unixnu status --json -D ../UniXNU-sheng and review profiles, components, source pins and patch order.", "For macOS, select sheng_macos_defconfig with --os macos-27 and pass --os macos-27 to each build command."]
