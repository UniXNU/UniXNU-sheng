[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["package/CpuFreq*", "scripts/*armcpu*"]
inputs = ["SM8550 CPU affinities, GIC distributor at 0x17100000, redistributors at 0x17180000, 0x40000 stride and 19.2 MHz timer.", "PSCI uses SMC. The board disables cpu1 and cpu2 in its DTS."]
configuration = ["dts/sheng.dts includes sm8550.dtsi; shared CPU and interrupt definitions come from the SoC source.", "Kernel arguments select sheng-smp=1 and armcpu-spi-ipi=1."]
procedure = ["Compile the board DTS and inspect enabled CPUs, GIC ranges and timer properties in the ADT.", "Record per-CPU entry, timer interrupts and inter-processor interrupt delivery."]
findings = ["CPU affinity values are hardware identifiers. Enabled CPU count and MPIDR affinities must be checked together.", "GIC register ranges must use translated physical addresses from the hardware tree."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["CPU selection and frequency policy are board inputs; SoC topology describes all cores."]
next_action = ["Attach per-CPU and interrupt observations for the selected firmware and image."]

[[area.evidence]]
kind = "source"
reference = "dts/sheng.dts"
result = "Implementation and configuration described in this section"

[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["Handoff DRAM at 0x80000000 with size 0x80000000; splash reservation at 0xb8000000 with size 0x2b00000.", "Payload owned-memory request is 0x130000000. Device DMA requires controller stream IDs, address widths and ownership."]
configuration = ["device_tree.source = device:dts/sheng.dts; include_dirs = [soc:dts].", "payload.adt.owned_memory_size and firmware reservations describe separate allocations."]
procedure = ["Compare firmware RAM ranges, reserved regions, DTS ranges and ADT memory-map entries.", "Check DMA buffers against controller address width, cache policy and SMMU mapping before submitting work."]
findings = ["Physical register translation and CPU virtual mappings have different purposes. Preserve physical resource ranges in hardware descriptions.", "GPU and UFS use different SMMU instances and stream assignments."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["The DTS declares the current handoff window and splash region; memory sizing requires the selected firmware map."]
next_action = ["Record the firmware memory map and each DMA consumer when changing reserved memory."]

[[area.evidence]]
kind = "source"
