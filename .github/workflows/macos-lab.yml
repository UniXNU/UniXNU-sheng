name: sheng macOS lab

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      GITHUB_TOKEN: ${{ github.token }}
      UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
      UNIXNU_LAB_PASSWORD: ${{ secrets.UNIXNU_LAB_PASSWORD }}
      NMB_PREBUILT_BRIDGE: ${{ github.workspace }}/metal-bridge/libadreno_metal_bridge.a.json
      UNIXNU_MACOS_TEST: ${{ github.workspace }}/device/scripts/macos-lab
    steps:
      - name: Check out device sources
        uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - name: Check out core sources
        uses: actions/checkout@v4
        with:
          repository: rponeawa/UniXNU
          ref: 96808720826b7e36a136014df36a8645aa40cf86
          path: UniXNU
          submodules: recursive
      - name: Check out firmware sources
        uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: fb2b2ae1d2f8c855cc76bb24ee3bcd28e3ecacbb
          path: uefi-sheng
          submodules: false
      - name: Restore build inputs
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          key: sheng-macos27-build-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sheng-macos27-build-v1-${{ runner.os }}-
          path: |
            UniXNU/out/feeds
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/mesa-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/adreno-metal-bridge
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/m2v-target
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/mesa-tu-macos27
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime/data.dbr
            device/drivers/Ath12kWifi/deps
            device/.cache/firmware
      - name: Refresh pinned translator checkout
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, shutil, subprocess
          from pathlib import Path
          core = Path('UniXNU')
          pin = json.loads((core / 'scripts/data/gpu-metal-vulkan-inputs.json').read_text())['translator']['commit']
          source = core / 'out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference/metal2vulkan'
          signature = hashlib.sha256((pin + '\n').encode() + (core / 'drivers/AdrenoMetal/bridge/patches/0043-unixnu-runtime-on-development-400efe79.patch').read_bytes()).hexdigest()
          stamp = source.with_name('unixnu-translator-patch.sha256')
          if source.exists():
              actual = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
              if actual != pin or not stamp.exists() or stamp.read_text().strip() != signature:
                  shutil.rmtree(source)
          stamp.parent.mkdir(parents=True, exist_ok=True)
          stamp.write_text(signature + '\n')
          PYTHON
      - name: Install build tools
        run: |
          brew install dtc llvm lld llvm@22 lld@22 cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup unifdef openssl@3 zstd blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          python3 - <<'PYTHON'
          from pathlib import Path
          toolchain = Path('uefi-toolchain').resolve()
          toolchain.mkdir()
          for name in ('clang', 'llvm-lib', 'llvm-rc', 'lld-link'):
              package = 'lld@22' if name == 'lld-link' else 'llvm@22'
              (toolchain / name).symlink_to(Path('/opt/homebrew/opt') / package / 'bin' / name)
          with Path(__import__('os').environ['GITHUB_ENV']).open('a') as output:
              output.write('CLANG_BIN=' + str(toolchain) + '/\n')
          PYTHON
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Fetch the source-matched Metal bridge
        run: |
          mkdir metal-bridge
          GH_TOKEN="$GITHUB_TOKEN" gh release download sheng-metal-bridge-7496958 --repo rponeawa/UniXNU \
            --pattern metal-bridge-macos27-7496958.tar.zst --dir metal-bridge
          zstd -dc metal-bridge/metal-bridge-macos27-7496958.tar.zst | tar -xf - -C metal-bridge
          rm -rf UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/m2v-target
      - name: Prepare installation
        working-directory: UniXNU
        run: |
          ./unixnu defconfig sheng_macos_defconfig -D ../device --os macos-27
          ./unixnu fetch --os macos-27
          python3 ../device/scripts/prepare-macos-install.py
      - name: Build images
        working-directory: device
        run: >-
          scripts/package.sh --os macos-27 --uefi ../uefi-sheng
          --kernel-arg autoreset=7200 --kernel-arg data-reset=1
          --kernel-arg gpu-trace=1 --kernel-arg gpu-perf=1
          --kernel-arg diag-export=6900 --kernel-arg diag=1
          --kernel-arg log-gpu=1 --kernel-arg log-power=1
      - name: Publish shader inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shader-inventory
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/prime-list.txt
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/prime-list.json
          retention-days: 1
      - name: Build root storage
        working-directory: UniXNU
        run: |
          python3 - <<'PY'
          import subprocess, sys
          sys.path.insert(0, 'scripts')
          from unixnu.cli import parser
          from unixnu.config import Context
          ctx = Context(parser().parse_args(['build', 'userdata', '-D', '../device', '--os', 'macos-27']))
          objects = []
          for window in ctx.board['userdata']['windows']:
              name = window['name']
              objects += ['--object', f'{name}.vroot={ctx.tree}/build/verified-root-{name}/hashes.bin']
          subprocess.run(['./unixnu', 'build', 'userdata', '--os', 'macos-27', *objects], check=True)
          PY
      - name: Stage device artifacts
        run: |
          mkdir artifacts
          target=UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos
          cp "$target/boot/boot.img" "$target/payload/payload.img" "$target/kernel/kernel.macho" "$target/package.manifest.json" artifacts/
          cp "$target/runtime/data.dbr" "$target/userdata/userdata-root.json" artifacts/
          cp "$target/tree/build/prime-list.txt" "$target/tree/build/prime-list.json" artifacts/
          zstd -T0 -3 --sparse "$target/userdata/userdata-root.img" -o artifacts/userdata-root.img.zst
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-macos-27
          path: artifacts/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            UniXNU/out/sheng/*/*/logs/*.log
            UniXNU/out/sheng/*/*/tree/build/adreno-metal-bridge/build-*.log
            UniXNU/out/sheng/*/*/tree/build/prime-list.*
          retention-days: 1
      - name: Save build inputs
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: sheng-macos27-build-v1-${{ runner.os }}-${{ github.run_id }}
          path: |
            UniXNU/out/feeds
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/mesa-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/adreno-metal-bridge
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/m2v-target
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/mesa-tu-macos27
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime/data.dbr
            device/drivers/Ath12kWifi/deps
            device/.cache/firmware
