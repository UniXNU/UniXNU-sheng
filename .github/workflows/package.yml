name: package

# Full macOS 27.3 build for sheng on the free macos-26 runner (Xcode 26.6, ~98 GB free disk).
# Builds kernel + package + firmware + payload + boot image, generates the root-policy signatures
# and the Data seed in-run. The 16 GB userdata image is assembled locally from the IPSW (block I/O
# only) using the vroot hash tables this run uploads; it is too large for free artifact storage.
# Artifacts belong to one device (platform seed secret): download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile"
        type: choice
        options: ["macos-27"]
        default: "macos-27"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: fd7280a44e60f33191e7714051366734326fecbc # main: macOS GPU/root-storage/APFS/VM fixes the author boots from
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: wifi firmware
        working-directory: device
        # WCN7850 firmware is not committed (proprietary inputs stay local). Fetch the exact
        # linux-firmware blobs the manifest pins and verify each before the build reads them.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          base = 'https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath12k/WCN7850/hw2.0/'
          src = Path('firmware/wcn7850')
          manifest = json.loads((src / 'manifest.json').read_text())['files']
          for name, exp in manifest.items():
              if name not in ('amss.bin', 'm3.bin', 'board-2.bin'):
                  continue
              dest = src / name
              if dest.exists() and dest.stat().st_size == exp['bytes'] and hashlib.sha256(dest.read_bytes()).hexdigest() == exp['sha256']:
                  print(f'{name}: already present and verified', flush=True)
                  continue
              print(f'fetching {name} from linux-firmware …', flush=True)
              req = urllib.request.Request(base + name, headers={'User-Agent': 'unixnu-ci'})
              data = urllib.request.urlopen(req, timeout=180).read()
              if len(data) != exp['bytes'] or hashlib.sha256(data).hexdigest() != exp['sha256']:
                  raise SystemExit(f'{name} does not match the manifest')
              dest.write_bytes(data)
              print(f'{name}: {len(data)} bytes verified', flush=True)
          PY
      - name: cache ath12k deps
        uses: actions/cache@v4
        with:
          path: device/drivers/Ath12kWifi/deps
          key: ath12k-deps-${{ hashFiles('device/drivers/Ath12kWifi/tools/source-lock.json') }}
      - name: fetch ath12k sources
        working-directory: device/drivers/Ath12kWifi
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The supplicant build only runs fetch-sources.py --check (verify, never fetch). Populate the
        # pinned Linux/FreeBSD/supplicant sources here so that check passes. Idempotent: the kernel
        # module's own fetch-sources.sh re-verifies without re-cloning. Cached across runs.
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          python3 tools/fetch-sources.py
      - name: build
        working-directory: UniXNU
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          OS_PROFILE: ${{ inputs.os }}
          UNIXNU_ROOT: ${{ github.workspace }}/UniXNU
          # The macOS root hash tables (~150 MiB) live in userdata as NAME.vroot, not the boot image;
          # the boot image carries only the 544-byte signed headers (manifest.header.bin).
          XNU_SOURCE_STORAGE_TABLES: userdata
          # main's ipsw prefetch defaults to 64 parallel range connections, which exhausts the runner's
          # socket buffers (Errno 55 ENOBUFS). Cap the concurrency so the root-image fetch completes.
          UNIXNU_IPSW_JOBS: "8"
        run: |
          set -euo pipefail
          DEVICE="$GITHUB_WORKSPACE/device"
          UEFI="$GITHUB_WORKSPACE/uefi-sheng"
          # Authenticate git fetches so the shared runner IP does not exhaust the anonymous API quota.
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          ./unixnu defconfig sheng_macos_defconfig -D "$DEVICE" --os "$OS_PROFILE"
          ./unixnu fetch -D "$DEVICE" --os "$OS_PROFILE"
          ./unixnu tree -D "$DEVICE" --os "$OS_PROFILE" --uefi "$UEFI"
          ./unixnu ipsw fetch KernelCache DeviceTree StaticTrustCache "Cryptex1,SystemTrustCache" "Cryptex1,AppTrustCache" \
                   OS "Cryptex1,SystemOS" "Cryptex1,AppOS" -D "$DEVICE" --os "$OS_PROFILE"
          OUT=$(./unixnu status --json -D "$DEVICE" --os "$OS_PROFILE" | python3 -c 'import sys,json;print(json.load(sys.stdin)["output"])')
          TREE="$OUT/tree"
          echo "output: $OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "TREE=$TREE" >> "$GITHUB_ENV"
          # Sign the root windows with a fresh owner key; headers go to the device repo, tables to the tree.
          python3 "$DEVICE/scripts/ci-macos-policies.py" -D "$DEVICE" --os "$OS_PROFILE" --uefi "$UEFI"
          # First-install Data seed (data.dbr): the payload build needs it; the tool runs as root.
          python3 "$DEVICE/scripts/ci-macos-data-seed.py" -D "$DEVICE" --os "$OS_PROFILE" --uefi "$UEFI"
          ./unixnu build kernel package firmware payload -D "$DEVICE" --os "$OS_PROFILE" --uefi "$UEFI" --init-data
          ./unixnu bootimg -D "$DEVICE" --os "$OS_PROFILE" --uefi "$UEFI"
      - name: collect root inputs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p staging/root staging/reports
          # Public policy headers + anchors + verification, and the vroot hash tables. NEVER the private key.
          if [ -d "$GITHUB_WORKSPACE/device/scripts/policies" ]; then
            cp -R "$GITHUB_WORKSPACE/device/scripts/policies" staging/root/policies
          fi
          for w in OS SystemOS App; do
            t="$TREE/build/verified-root-$w/hashes.bin"
            [ -f "$t" ] && cp "$t" "staging/root/$w.vroot"
          done
          # Reports of every step that produced one.
          for j in "$OUT"/boot/boot.json "$OUT"/payload/payload.json "$OUT"/kernel/kernel.macho.json \
                   "$OUT"/runtime/inputs.json "$OUT"/runtime/generated.json; do
            [ -f "$j" ] && cp "$j" staging/reports/
          done
          [ -d "$OUT/logs" ] && cp -R "$OUT/logs" staging/reports/logs || true
          du -sh staging/* || true
      - name: boot image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ env.OUT }}/boot/boot.img
            staging/reports
      - name: root policies and vroot tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: warn
          path: staging/root