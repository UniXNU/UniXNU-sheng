["os_overrides"."macos-27.3-26C5035r"."payload"]
# The macOS kernel collection (137 MiB), the Data seed (20 MiB) and the GPU addon (the Metal plugin and Turnip, zlib-compressed).
# iPadOS 17 and 26 images boot on this device with 208 MiB.
"size_mib" = 200
# GPU as on iPadOS 27: fb-bgra=1 renders in system memory with transient attachments in GMEM (Turnip patches), fb-gpu=1 hands the
# compositor's frames to the render server's GPU copy when the display cannot scan them out directly (dpu-scanout=2).
# macOS: storage, display, HID, USB, CPU, GPU, audio (with the battery on the ADSP), and en0 (ShengEthernet), which carries the Wi-Fi module. Bluetooth is not enabled yet; AppSync
# and the launchd watchdog policy (lite) are iPadOS only.
# The macOS-only switches the kernel reads (timebase-user, cs-lazy, keyboard-lone, armcpu-edge, boot-payload-release, thermal,
# thermal-level, board-clock) are built-in arguments of the package (BootWatchdogPolicy.c), so that this line stays under the
# 1000-byte limit with the run arguments; name=0 here turns one off. No -v and no serial=3 here: this kernel has no reader of -v (the boot text is vc-text=1) and no serial device, and serial=3 only
# starts a thread that polls every 16 ms. armcpu-edge=1 builds the scheduler's two-cluster matrix, so an idle P
# core takes waiting E work. boot-payload-release=1 returns the GPU addon blob and the packed seed to the VM once they are
# installed. timebase-user=1 lets userspace read the scaled timebase itself instead of trapping for every read.
# cs-lazy=1 authenticates a 16 KiB signed block when one of its pages is first used instead of reading every image whole when
# its signature is added (about 30 s of every boot for the dyld shared cache).
# keyboard-lone=1 takes a single touchpad contact as the finger although the controller gives it no confidence (it does
# so for the first seconds of use on macOS). thermal=1 logs the SoC temperatures beside the firmware's frequency limit, and thermal-level=1 gives
# macOS its thermal pressure level from them (the service thermalmonitord reads). board-clock=7 runs the calendar from the
# PMIC counter plus the offset stored in the PMIC, and stores it when the system sets the time.
"kernel_args" = ["debug=0x14e", "kt_fixed_zones=120", "-no_slto_panic", "use_contiguous_hint=0", "native-source-storage=1", "native-ufs-root=1", "offline-mobile-graphics-load=1", "offline-mobile-graphics-client=1", "offline-legacy-register=1", "offline-legacy-gop=1", "offline-legacy-unit-scale=2", "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1", "offline-legacy-cpu-present=1", "offline-legacy-phase=4", "offline-key-events=1", "aks=1", "aks-sls=3", "offline-hid-input=1", "offline-hid-home=1", "touch=4", "touch-hid=1", "buttons=1", "keyboard=1", "log=1", "smp=1", "armcpu-spi-ipi=1", "armcpu-self-ipi=1", "data-persist=2", "backlight=1", "cpufreq=4", "dpu-scanout=2", "no-lc=1", "vsync=120", "vsync-fixed=1", "disable-watchdogd=1", "usb=1", "adsp=2", "audio=12", "wifi=5", "vc-text=1", "exec-log=1", "apfs-boot-shim=1", "ethernet=1", "bluetooth=1", "fb-half=2", "gpu-power=9", "gpu-metal=1", "fb-gpu=1", "fb-bgra=1", "gpu-dcvs=1", "gpu-addon=1", "timebase-hz=24000000", "ca-triple-buffer=1", "ca-free-wakeup=1"]

# WindowServer presents 8-bit BGRA, which the display pipes scan out directly, instead of half float converted by the GPU each frame:
# QuartzCore's IOMFBDisplay::framebuffer_pixel_format (26C5035r, dyld_shared_cache_arm64e.03 file offset 0x5de1134) keeps 'RGhA' on
# `tbnz w8, #0` while CADeviceIsVirtualized is set (vmm-present). The branch becomes a NOP as a fixup of signed text, applied when
# the page passes code signing validation; a write into the mapped page (the plugin's former ca-fb-8bit) made the page invalid and
# code signing killed WindowServer.
"text_fixups" = ["dyld_shared_cache_arm64e.03,5de1134,08060037,1f2003d5"]

["os_overrides"."macos-27.3-26C5035r"."payload"."adt"]
# T6050, the chip of Mac17,11.
"chip_id" = "6050"
# The window starts at DRAM bank 1 (0x880000000) and spans the inaccessible range 0x8BB300000..0x8C0000000 up to the end of the
# bank. DarwinBoot lists that range and the memory the firmware keeps in a table of this many ranges, and this kernel leaves them
# out (window-memory-excluded-ranges.patch). 6 GiB is the most the 4 KiB bootstrap tables map. Other profiles keep the single run:
# their kernels do not read the table.
"owned_memory_size" = "0x180000000"
"owned_memory_excluded_ranges" = 64
# DarwinBoot records where the payload RAM disk and the entry's initrd buffer lie in the firmware's memory map
# (sysctl kern.boot_payload_memory).
"loader_inputs" = true
# DarwinBoot lists the free memory outside the window (the low DRAM bank, about 867 MiB by the firmware's map): the kernel
# can adopt it as ordinary VM memory, page by page after a probe load (window-outside-memory-adoption.patch). The built-in
# arguments keep it off (memory-outside=0): with it on, contiguous kernel allocations failed in some boots and the GPU did
# not start; memory-outside=1 on the command line turns it on. The GPU pool over the same memory is off too (gpu-pool=0):
# it overlapped the audio driver's buffer. The audio driver's DSP buffer sits in that memory at a fixed 32-bit address (package/AudioProbe.cpp
# kLowBuffer, 64 KiB), so it is kept out.
"owned_memory_outside_ranges" = 8
"owned_memory_outside_reserved" = ["0xd0000000:0x10000"]

["os_overrides"."macos-27.3-26C5035r"."payload"."runtime"]
"target" = "macos27"
"build" = "26C5035r"
# The Adreno Metal plugin (macos27 build) in the payload's addon, with the boot shim: the kernel writes it to /Library/GPUBundles.
"gpu_addon" = true
# The macOS seed keeps the Data template's owners, so it is made as root (runtime.py prints the command).
"data_seed_tool" = "scripts/make-macos-data-seed.py"
"skip_setup" = false
# The persistent Data store sits below the 1 GiB log reserve at the end of userdata and must clear the root image
# (16.4 GiB with OS, SystemOS, App and their .vroot tables). 215 GiB overlapped it by 36 MiB; 210 GiB leaves 5 GiB.
"data_gib" = 210
# The owner apfs_boot_util for the read-only root container (launchd mount-phase-1/2), with apfs-boot-shim=1.
"boot_shims" = true
# The audio server plug-in as a macOS driver bundle in /Library/Audio/Plug-Ins/HAL (Library/ files of the addon).
"audio_target" = "arm64e-apple-macos27.0"
# The WiFi supplicant runs from /private/var/ngpu/bin; its job is a plist of /Library/LaunchDaemons (no launchd cache merge).
"wifi_target" = "macos27"
# Bluetooth: the patched daemon and BlueTool in the addon's sbin (shown over /usr/sbin), the capability library in its lib.
"bluetooth_target" = "macos27"
"wifi_bin_prefix" = "bin"

